[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "networkx>=3.6.1",
    "openai>=3.13.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
